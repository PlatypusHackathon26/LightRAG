machines:
  COMP-TB-01:
    name: "COMP-TB-01"
    description: "Bệ thử máy nén số 1 (DENSO Test Bench #1)"
    rpm_setpoint: 1500
    rpm_min_safe: 800
    rpm_max: 3000
    metrics:
      discharge_temp:
        label: "Nhiệt độ đầu xả"
        unit: "°C"
        direction: "above"
        normal_min: 70.0
        normal_max: 100.0
        warn: 105.0
        critical: 120.0
        display_min: 50.0
        display_max: 150.0
        decimals: 1
      suction_pressure:
        label: "Áp suất hút"
        unit: "bar"
        direction: "below"
        normal_min: 1.8
        normal_max: 3.0
        warn: 1.5
        critical: 1.0
        display_min: 0.0
        display_max: 5.0
        decimals: 2
      discharge_pressure:
        label: "Áp suất xả"
        unit: "bar"
        direction: "above"
        normal_min: 12.0
        normal_max: 17.0
        warn: 19.0
        critical: 23.0
        display_min: 5.0
        display_max: 30.0
        decimals: 1
      condenser_fan_rpm:
        label: "Tốc độ quạt dàn ngưng"
        unit: "rpm"
        direction: "below"
        normal_min: 2200.0
        normal_max: 2600.0
        warn: 1500.0
        critical: 500.0
        display_min: 0.0
        display_max: 3000.0
        decimals: 0
      vibration:
        label: "Độ rung"
        unit: "mm/s"
        direction: "above"
        normal_min: 1.0
        normal_max: 3.0
        warn: 4.5
        critical: 7.0
        display_min: 0.0
        display_max: 10.0
        decimals: 2
      oil_level:
        label: "Mức dầu"
        unit: "%"
        direction: "below"
        normal_min: 80.0
        normal_max: 100.0
        warn: 60.0
        critical: 40.0
        display_min: 0.0
        display_max: 100.0
        decimals: 0
      compressor_rpm:
        label: "Tốc độ máy nén"
        unit: "rpm"
        direction: "info"
        normal_min: null
        normal_max: null
        warn: null
        critical: null
        display_min: 0.0
        display_max: 3500.0
        decimals: 0

