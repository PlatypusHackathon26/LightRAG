# Infrastructure for iot_service: MQTT broker (simulator <-> service) and TimescaleDB (telemetry,
# events, incidents, actions). Both listen on localhost only; the service itself runs on the host
# (denso/scripts/serve_chat.ps1 -WithIoT starts this file, the service and the simulator).
#
#   docker compose -f iot_service/docker-compose.yml up -d
#
# The credentials match the defaults in app/config.py (DB_DSN): local demo only, never exposed.
name: denso-iot

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denso_iot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Runs once, on an empty data volume; app/db.py also creates missing tables at start.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d denso_iot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  timescale-data:
